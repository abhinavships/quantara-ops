apiVersion: 1
datasources:
  - name: Quantara
    uid: quantara-pg
    type: grafana-postgresql-datasource
    access: proxy
    url: "${PG_HOST}:5432"
    user: "${PG_USER}"
    jsonData:
      database: "${PG_DATABASE}"
      sslmode: "${PG_SSLMODE}"
      postgresVersion: 1500
    secureJsonData:
      password: "${PG_PASSWORD}"
